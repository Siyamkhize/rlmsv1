# SonarQube Project Configuration for RLMS V1

# Project identification
sonar.projectKey=rlmsv1
sonar.projectName=RLMS V1 - Rural Learner Management System
sonar.projectVersion=1.0.0
sonar.organization=siyamkhize

# Source and test paths
sonar.sources=lib
sonar.tests=test

# File exclusions
sonar.exclusions=\
    **/*.g.dart,\
    **/*.freezed.dart,\
    **/generated/**,\
    **/*.config.dart,\
    **/vendor/**,\
    **/venv/**,\
    **/build/**,\
    **/.dart_tool/**,\
    **/android/**,\
    **/ios/**,\
    **/web/**,\
    **/windows/**,\
    **/linux/**,\
    **/macos/**

# Test file patterns
sonar.test.inclusions=**/*_test.dart

# Dart language settings
sonar.language=dart

# Coverage settings
sonar.dart.coverage.reportPaths=coverage/lcov.info
sonar.coverageReportPaths=coverage/lcov.info

# Encoding
sonar.sourceEncoding=UTF-8

# Analysis parameters
sonar.dart.analyzer.report.path=.dart_tool/analysis.log

# Quality gate settings
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

# Code duplication
sonar.cpd.dart.minimumTokens=50

# Issue ignore rules for generated files
sonar.issue.ignore.multicriteria=e1,e2,e3,e4
sonar.issue.ignore.multicriteria.e1.ruleKey=*
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.g.dart
sonar.issue.ignore.multicriteria.e2.ruleKey=*
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*.freezed.dart
sonar.issue.ignore.multicriteria.e3.ruleKey=*
sonar.issue.ignore.multicriteria.e3.resourceKey=**/generated/**
sonar.issue.ignore.multicriteria.e4.ruleKey=*
sonar.issue.ignore.multicriteria.e4.resourceKey=**/*.config.dart

# Security hotspot rules
sonar.security.hotspots=true

# Branch analysis
sonar.branch.name=${BRANCH_NAME}
