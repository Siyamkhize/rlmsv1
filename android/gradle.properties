# Project-wide Gradle settings - MEDIUM MEMORY (4GB RAM)
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=384m -Dfile.encoding=UTF-8 -XX:+UseSerialGC -XX:+UseCompressedOops
kotlin.daemon.jvmargs=-Xmx512m -XX:MaxMetaspaceSize=256m
kotlin.compiler.execution.strategy=in-process
org.gradle.workers.max=1
android.useAndroidX=true
android.enableJetifier=false

# Use JDK 11 (compatible with AGP 7.3.1 and Gradle 7.5)
org.gradle.java.home=C:\\Program Files\\Java\\jdk-17.0.12

# Disable Gradle daemon to avoid cache issues
org.gradle.daemon=false

# Disable configuration cache to save memory
org.gradle.configuration-cache=false

# Disable parallel execution to save memory
org.gradle.parallel=false

# Optimize for low memory systems
org.gradle.caching=false

# Additional memory optimizations
org.gradle.console=plain
org.gradle.logging.level=quiet

# SDK compatibility settings
android.defaults.buildfeatures.buildconfig=true
android.nonTransitiveRClass=false
android.enableR8.fullMode=false

# Allow normal install; does not affect debuggable (see debug/release manifests)
android.injected.testOnly=false
