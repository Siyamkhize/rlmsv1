buildscript {
    ext.minSdkVersion = 23  // Required by flutter_doc_scanner (ML Kit document scanner)
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:7.3.1'  // AGP 7.3.1 compatible with Java 11
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.22"  // Compatible with AGP 7.3.1
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
    
    // Force Java 11 for all subprojects (including plugins)
    tasks.withType(JavaCompile).configureEach {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }
}

// Custom buildDir configuration removed to fix Flutter APK detection
// rootProject.buildDir = 'C:/temp/gradle-build'
// subprojects {
//     project.buildDir = "${rootProject.buildDir}/${project.name}"
// }

subprojects {
    afterEvaluate {
        if (project.hasProperty('android')) {
            android {
                compileSdkVersion 35
                
                // Force Java 11 for ALL plugins, overriding their own settings
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_11
                    targetCompatibility JavaVersion.VERSION_11
                }
            }
        }
        
        // Also force Java 11 at task level for any JavaCompile tasks
        tasks.withType(JavaCompile).configureEach {
            sourceCompatibility = '11'
            targetCompatibility = '11'
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
