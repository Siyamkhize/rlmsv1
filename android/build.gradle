buildscript {
    ext.minSdkVersion = 23  // Required by flutter_doc_scanner (ML Kit document scanner)
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.3.0'  // AGP 8.3.0 for Java 17
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.24"  // Compatible with AGP 8.3.0
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

subprojects {
    afterEvaluate {
        if (project.hasProperty('android')) {
            android {
                compileSdkVersion 35
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
