name: Dart CI

on:
  push:
    branches: [ "main", "development" ]
  pull_request:
    branches: [ "main", "development" ]

jobs:
  analyze:
    name: Analyze Code
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
      
      - name: Install dependencies
        run: flutter pub get
      
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .
        continue-on-error: true
      
      - name: Analyze project source
        run: |
          flutter analyze --no-fatal-infos 2>&1 | tee analyze.log
          ERROR_COUNT=$(grep -c "error -" analyze.log || true)
          WARNING_COUNT=$(grep -c "warning -" analyze.log || true)
          echo "Errors: $ERROR_COUNT, Warnings: $WARNING_COUNT"
          if [ $ERROR_COUNT -gt 0 ]; then
            echo "❌ Analysis failed with $ERROR_COUNT error(s)"
            exit 1
          else
            echo "✅ Analysis passed (warnings are non-blocking)"
            exit 0
          fi
  
  build:
    name: Build APK
    runs-on: ubuntu-latest
    needs: analyze

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
      
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - name: Install dependencies
        run: flutter pub get
      
      - name: Build APK (Debug)
        run: flutter build apk --debug
        continue-on-error: true
